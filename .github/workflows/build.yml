name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FreeFit-debug.apk
          cp app/build/outputs/apk/release/app-release.apk FreeFit-release.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FreeFit-APK
          path: |
            FreeFit-debug.apk
            FreeFit-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FreeFit-release.apk
          generate_release_notes: true
